{% load static%}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create WishList</title>
    <link rel="stylesheet" href="{% static 'WishStack/css/create1.css' %}">
    <style>
      body {
        background-image: url("{% static 'WishStack/images/Gift.png' %}");
      }
      .modal {
        display: none; /* Hidden by default */
        position: fixed; /* Stay in place */
        z-index: 1; /* Sit on top */
  left: 0;
  top: 0;
  width: 100%; /* Full width */
  height: 100%; /* Full height */
  overflow: auto; /* Enable scroll if needed */
  background-color: rgb(0,0,0); /* Fallback color */
  background-color: rgba(0,0,0,0.4); /* Black w/ opacity */
}

/* Modal Content/Box */
.modal-content {
  background-color: #fefefe;
  margin: 15% auto; /* 15% from the top and centered */
  padding: 20px;
  border: 1px solid #888;
  width: 80%; /* Could be more or less, depending on screen size */
}

/* The Close Button */
.close {
  color: #aaa;
  float: right;
  font-size: 28px;
  font-weight: bold;
}

.close:hover,
.close:focus {
  color: black;
  text-decoration: none;
  cursor: pointer;
}@import url("https://fonts.googleapis.com/css2?family=Poppins:wght@100;200;300;400;500&display=swap");
:root {
  --primary: #eeeeee;
  --secondary: #df9953;
  --green: #82cd47;
  --secondary-light: rgb(34, 124, 112, 0.2);
  --secondary-light-2: rgb(127, 183, 126, 0.1);
  --white: #fff;
  --black: #393e46;

  --shadow: 0px 2px 8px 0px var(--secondary-light);
}

* {
  margin: 0;
  padding: 0;
  list-style-type: none;
  box-sizing: border-box;
  font-family: "Poppins", sans-serif;
}

body {
  background-size: cover; /* Cover the entire background */
  background-attachment: fixed;
  background-repeat: no-repeat;
}
.wrapper{
    justify-content: center;
    align-items: center;
    min-height: 110vh;
    background: rgba(39, 39, 39, 0.4);
}

.navbar {
  display: flex;
  align-items: center;
  height: 70px;
  background-color: var(--white);
  padding: 0 8%;
  box-shadow: var(--shadow);
}

.navbar-logo {
  cursor: pointer;
}

.navbar-list {
  text-align: center; /* Center-align the text */
  width: 100%; /* Ensure the list takes up the full width */
  margin: 0; /* Remove default margin */
  padding: 0; /* Remove default padding */
  
}

.navbar-list li {
  display: inline-block; /* Display list items inline */
  margin-right: 20px; /* Add some spacing between items */
}

.navbar-list li:last-child {
  margin-right: 0; /* Remove margin from the last item */
}


.navbar-list li a {
  font-size: 24px;
  font-weight: 500;
  color: var(--black);
  text-decoration: none;
  font-family: Century Gothic;
}

.profile-dropdown {
  position: relative;
  width: fit-content;
  margin-left: auto;
}

.profile-dropdown-btn {
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 5px;
  border-radius: 50%; /* Makes it a circle */
  background-color: #f0f0f0; /* Background color for the circle */
  transition: background-color 0.3s;
}

.profile-dropdown-btn:hover {
  background-color: #e0e0e0; /* Change background color on hover */
}

.profile-img img {
  width: 30px; /* Set the size of the profile image */
  height: 30px;
  border-radius: 50%; /* Make the image round */
  margin-right: 5px; /* Add some space between the image and the name */
}

.profile-img {
  width: 30px; /* Set the size of the profile image container */
  height: 30px;
  overflow: hidden; /* Hide overflow if the image is larger */
}

.profile-img i {
  position: absolute;
  right: 0;
  bottom: 0.3rem;
  font-size: 0.5rem;
  color: var(--green);
}

.profile-dropdown-btn span {
  margin: 0 0.5rem;
  margin-right: 0;
}

.profile-dropdown-list {
  position: absolute;
  top: 68px;
  width: 220px;
  right: 0;
  background-color: var(--white);
  border-radius: 10px;
  max-height: 0;
  overflow: hidden;
  box-shadow: var(--shadow);
  transition: max-height 0.5s;
}

.profile-dropdown-list hr {
  border: 0.5px solid var(--green);
}

.profile-dropdown-list.active {
  max-height: 500px;
}

.profile-dropdown-list-item {
  padding: 0.5rem 0rem 0.5rem 1rem;
  transition: background-color 0.2s ease-in, padding-left 0.2s;
}

.profile-dropdown-list-item a {
  display: flex;
  align-items: center;
  text-decoration: none;
  font-size: 0.9rem;
  font-weight: 500;
  color: var(--black);
}

.profile-dropdown-list-item a i {
  margin-right: 0.8rem;
  font-size: 1.1rem;
  width: 2.3rem;
  height: 2.3rem;
  background-color: var(--secondary);
  color: var(--white);
  line-height: 2.3rem;
  text-align: center;
  margin-right: 1rem;
  border-radius: 50%;
  transition: margin-right 0.3s;
}

.profile-dropdown-list-item:hover {
  padding-left: 1.5rem;
  background-color: var(--secondary-light);
}


.wishlist-item {
    display: flex;
    justify-content: center;
    align-items: center;
    border: 1px solid #ccc;
    border-radius: 20px; /* Increased border radius for curved edges */
    padding: 105px; /* Increased padding for larger boxes */
    margin: 10px 20px; /* Updated margin for spacing between boxes */
    background-color: #ffffff; /* White background color */
}

.wishlist-container {
    display: flex;
    flex-wrap: wrap; /* Allow boxes to wrap to the next line */
    justify-content: center; /* Center-align boxes */
    margin-top: 20px;
    width:100%
}

.button-container {
    display: flex;
    flex-direction: column;
    align-items: center;
}

.button-container span {
    margin-bottom: 10px; /* Space between the message and the button */
}



</style>
</head>
<body>
  <div class="wrapper">
    <nav class="navbar">
      <ul class="navbar-list">
        <li><a>{{ name }}'s WishList</a></li>
      </ul>
      <!--<div class="profile-dropdown">
        <div class="profile-dropdown-btn">
        <div class="profile-img">
            <img src="{% static 'WishStack/images/humanicon.jpeg' %}" alt="Profile Image" />
          </div>
          <ul class="profile-dropdown-list">
            <li><a href="/edit"><i class="fa-regular fa-user"></i> Edit Profile</a></li>
            <li><a href="/logout"><i class="fa-solid fa-arrow-right-from-bracket"></i> Log out</a></li>
          </ul>
        </div>
      </div>-->
      <button class="logout-button1" onclick="window.location.href='{% url 'logout' %}'">Logout</button>
    </nav>
    <div id="wishlist-container" class="wishlist-container">
      <div class="wishlist-item">
          <div class="button-container">
              <span>Create a wishlist</span>
              <a href="/wishing/"><button class="add-button">+</button></a>
          </div>
      </div>
    </div>
    {% for wish_name in wishlist_names %}
    <div id="wishlist-container" class="wishlist-container">
      <div class="wishlist-item" onclick="redirectToWishing()">
        <div class="button-container">
            <a href="{% url 'main' wish_name.id %}"><button class="add-button">{{ wish_name.name }}</button></a>
        </div>
      </div>
    </div>
    {% endfor %}
 
  </div>
  <script>
    localStorage.setItem("userName",'{{user.first_name}}')
    let dropdownBtn = document.querySelector(".profile-dropdown-btn");

    dropdownBtn.addEventListener("click", function() {
      let dropdownList = dropdownBtn.querySelector(".profile-dropdown-list");
      dropdownList.classList.toggle("active");
    });

    window.addEventListener("click", function(event) {
      if (!dropdownBtn.contains(event.target)) {
        let dropdownList = dropdownBtn.querySelector(".profile-dropdown-list");
        dropdownList.classList.remove("active");
      }
    });

    let optionsBtn = document.querySelector(".options-button");

    optionsBtn.addEventListener("click", function() {
      let optionsDropdown = document.querySelector(".options-dropdown-content");
      optionsDropdown.classList.toggle("active");
    });

    window.addEventListener("click", function(event) {
      if (!optionsBtn.contains(event.target)) {
        let optionsDropdown = document.querySelector(".options-dropdown-content");
        optionsDropdown.classList.remove("active");
      }
    });

    function setId(wishlistId) {
      localStorage.setItem("wishlistId", wishlistId);
  }

    function addBox() {
    let existingWishlistContainer = document.getElementById('wishlist-container');
    let clonedWishlistContainer = existingWishlistContainer.cloneNode(true);

    let addButton = clonedWishlistContainer.querySelector('.add-button');
    addButton.parentNode.removeChild(addButton);

    let labelSpan = clonedWishlistContainer.querySelector('span');
    labelSpan.parentNode.removeChild(labelSpan);

    let label = document.createElement('label');
    label.textContent = 'Create a wishlist';
    
    // Append the label to the wishlist-item
    let wishlistItem = clonedWishlistContainer.querySelector('.wishlist-item');
    wishlistItem.appendChild(label);

    let wrapper = document.querySelector('.wrapper');
    wrapper.appendChild(clonedWishlistContainer);
}



    function redirectToWishing() {
      window.location.href = "/create/";
    }

    function deleteList(wishlistId) {
    // You can use AJAX to send a POST request to the server to delete the wishlist
    // Here's an example using fetch API
    fetch(`/delete/${wishlistId}`, {
        method: 'POST',
        headers: {
            'Content-Type': 'application/json',
            // You may need to include CSRF token if your Django project requires it
            // 'X-CSRFToken': getCookie('csrftoken') // Example of getting CSRF token from a cookie
        },
        // You can include additional data in the request body if needed
        // body: JSON.stringify({ wishlistId: wishlistId })
    })
    .then(response => {
        if (response.ok) {
            // Wishlist deleted successfully, you can perform any additional actions here
            console.log('Wishlist deleted successfully');
            // For example, you may want to remove the deleted wishlist from the UI
            // You can do this using JavaScript DOM manipulation
            // Example: document.getElementById(`wishlist-${wishlistId}`).remove();
        } else {
            // Wishlist deletion failed, handle error if needed
            console.error('Failed to delete wishlist');
        }
    })
    .catch(error => {
        console.error('Error deleting wishlist:', error);
    });
}


  
  </body>
</html>
